<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8069C0"/>
      <stop offset="1" stop-color="#4F378B"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD8E4"/>
      <stop offset="1" stop-color="#FFAFC9"/>
    </linearGradient>
  </defs>

  <!-- 底板：紫色圆角方块（Android 会再按机型裁形，所以画满即可） -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>

  <!-- 画布：手机外框 -->
  <rect x="12.6" y="7.4" width="22.8" height="33.2" rx="4.4"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.96" stroke-width="2.2"/>
  <!-- 状态条 -->
  <rect x="20.6" y="10.4" width="6.8" height="1.5" rx="0.75" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- 标题条（强调色：这是“可编辑的控件”） -->
  <rect x="16.6" y="14.6" width="14.8" height="3.6" rx="1.8" fill="url(#acc)"/>
  <!-- 文本行 -->
  <rect x="16.6" y="20.3" width="9" height="2.2" rx="1.1" fill="#FFFFFF" fill-opacity="0.92"/>
  <!-- 被选中的控件：虚化底 + 白框 + 四角控制点 -->
  <rect x="16.6" y="24.6" width="14.8" height="7.6" rx="1.8" fill="#FFFFFF" fill-opacity="0.24"/>
  <rect x="16.6" y="24.6" width="14.8" height="7.6" rx="1.8"
        fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="15.4" y="23.4" width="2.4" height="2.4" rx="0.5" fill="#FFFFFF"/>
  <rect x="30.2" y="23.4" width="2.4" height="2.4" rx="0.5" fill="#FFFFFF"/>
  <rect x="15.4" y="31" width="2.4" height="2.4" rx="0.5" fill="#FFFFFF"/>
  <rect x="30.2" y="31" width="2.4" height="2.4" rx="0.5" fill="#FFFFFF"/>

  <!-- 底部导航条 -->
  <rect x="19.4" y="35.4" width="9.2" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
